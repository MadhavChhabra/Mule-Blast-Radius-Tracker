# One command to run the whole product:  docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080 — the server serves both the dashboard and the API.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apiguard
      POSTGRES_USER: apiguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apiguard}
    # Not published to the host by default — only the server needs it. Uncomment to inspect the DB.
    # ports:
    #   - "5432:5432"
    volumes:
      - apiguard-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/apiguard
      DB_USER: apiguard
      DB_PASSWORD: ${DB_PASSWORD:-apiguard}
      SPRING_PROFILES_ACTIVE: default
      # Shared secret every caller must send (X-API-Key or Bearer). Leave blank only on a trusted
      # network — without it anyone who can reach the port can read the estate and trigger syncs.
      APIGUARD_API_KEY_SERVER: ${APIGUARD_API_KEY_SERVER:-}
      # Set this to persist the saved Anypoint secret across container restarts (encrypted at rest).
      # Generate once, keep it stable, back it up. Blank = credentials are kept in memory only.
      APIGUARD_ENCRYPTION_KEY: ${APIGUARD_ENCRYPTION_KEY:-}
      # A container has no meaningful local repos to scan, and allowing filesystem paths here would
      # let a source read arbitrary container directories.
      APIGUARD_ALLOW_LOCAL_PATHS: "false"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APIGUARD_WEBHOOK_SPEC_PATH: ${APIGUARD_WEBHOOK_SPEC_PATH:-}
      APIGUARD_WEBHOOK_API_NAME: ${APIGUARD_WEBHOOK_API_NAME:-}
    ports:
      - "${APIGUARD_PORT:-8080}:8080"

volumes:
  apiguard-pg:

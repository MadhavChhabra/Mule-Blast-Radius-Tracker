name: apiguard_dashboard
description: "BlipRadius dashboard — the estate map, field-level blast radius, and change history."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  graphview: 1.2.0   # pinned: 1.5.x requires Flutter 3.27+ (uses Color.withValues)
  fl_chart: ^0.68.0
  flutter_markdown: ^0.7.3
  # Already on the classpath through Flutter itself; declared because the estate map names Quad
  # and Vector3 directly when it converts the map viewport into canvas coordinates.
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundled, not fetched: BlipRadius has to run on air-gapped enterprise networks, so a webfont
  # CDN would silently fall back to a system face exactly where it matters most.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

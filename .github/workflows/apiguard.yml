name: Blipradius

# Demonstrates the Blipradius gate on every pull request. This repo ships two sample
# specs (v1 -> v2) with intentional breaking changes, so the check always produces a
# report and a PR comment. Set `fail-on-breaking: true` to turn it into a hard gate.
#
# To gate your own spec instead, replace old-spec/new-spec below with your real paths —
# see README "As a GitHub Action" for the base-vs-head pattern.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # required to post the PR comment

concurrency:
  group: blipradius-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blipradius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Blipradius (demo: v1 -> v2)
        uses: ./action
        with:
          old-spec: samples/orders-api/openapi-v1.yaml
          new-spec: samples/orders-api/openapi-v2.yaml
          api: orders-api
          manifests: samples/manifests
          fail-on-breaking: 'false'


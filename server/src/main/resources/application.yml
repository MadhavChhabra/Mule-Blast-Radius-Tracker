spring:
  application:
    name: apiguard
  # Let in-flight syncs and analyses finish instead of being cut off on SIGTERM (rolling deploys).
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apiguard}
    username: ${DB_USER:apiguard}
    password: ${DB_PASSWORD:apiguard}
    hikari:
      # Repo scanning runs on its own pool (apiguard.scan.parallelism), so keep DB connections
      # comfortably above that plus the request threads that ingest results.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  # Exchange RAML/OAS archives are small; the cap stops an oversized upload from tying up the server.
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Error bodies come from ApiExceptionHandler; never let the container leak a stack trace.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/markdown,text/html,text/css,application/javascript
    min-response-size: 2048

apiguard:
  # Demo data is OFF by default so a real estate is never mixed with sample APIs / a fake breaking
  # change. Only the `dev` profile seeds a demo estate. Real users start empty and connect Anypoint
  # or scan a repo.
  seed:
    enabled: ${SEED_DEMO:false}
  # AES-GCM key used by CredentialCipher for at-rest encryption of any credential
  # persisted server-side (Anypoint client-secret when apiguard.anypoint.persist is turned on,
  # future OAuth tokens, etc). Leave blank to disable encryption; any code path that needs to
  # persist a secret will refuse to run until this is set. Rotate by re-encrypting all stored
  # values.
  security:
    encryption-key: ${APIGUARD_ENCRYPTION_KEY:}
    # When no explicit key is set, one is generated and kept in this file so saved secrets survive
    # restarts with zero setup (ideal for the desktop app). On a shared server set APIGUARD_ENCRYPTION_KEY
    # instead and back it up. Blank both to run without at-rest encryption (credentials then stay in memory).
    key-file: ${APIGUARD_KEY_FILE:${user.home}/.apiguard/credential.key}
  # Structured JSON logs — activate the `json` Spring profile (spring.profiles.active=json)
  # and Wakegraph emits Logstash-formatted lines suitable for a log aggregator.
  logging:
    json: false
  # Repo scanning. `allow-local-paths` lets a source be a filesystem path instead of a git URL —
  # right for the desktop app, wrong for a shared server (it would read any directory the server
  # process can reach), so turn it off there.
  scan:
    allow-local-paths: ${APIGUARD_ALLOW_LOCAL_PATHS:true}
  # GitHub integration — leave blank to disable (the app then only logs what it would do).
  github:
    token: ${GITHUB_TOKEN:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    # /webhooks/github rejects every payload until a secret is set. Only flip this on for a local
    # experiment — an unsigned webhook lets anyone trigger analyses and GitHub API calls.
    webhook-allow-unsigned: ${GITHUB_WEBHOOK_ALLOW_UNSIGNED:false}
  # Slack Incoming Webhook — leave blank to disable notifications.
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  # Anypoint Platform (Connected App, client-credentials) — org-wide discovery via API Manager
  # contracts + Exchange. Leave client-id/secret blank to disable. The secret stays server-side.
  anypoint:
    base-url: ${ANYPOINT_BASE_URL:https://anypoint.mulesoft.com}
    client-id: ${ANYPOINT_CLIENT_ID:}
    client-secret: ${ANYPOINT_CLIENT_SECRET:}
    org-id: ${ANYPOINT_ORG_ID:}
    environment: ${ANYPOINT_ENV:}
    # Save the Anypoint connection (secret encrypted at rest) so it is restored on the next restart
    # and the user does not re-enter it. Set false on a shared/multi-tenant server if undesired.
    persist: ${ANYPOINT_PERSIST:true}

# Allow the Flutter dashboard (dev server) to call the API.
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: apiguard

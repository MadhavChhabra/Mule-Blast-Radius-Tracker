plugins {
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Generate build-info.properties so the running server can report its real
// build version (surfaced via /api/health and /api/version) instead of a literal.
springBoot {
    buildInfo()
}

dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Publishes BlipRadius's own REST API at /v3/api-docs (+ /api-docs UI).
    // swagger-parser (pulled in by :core for RAML/OAS loading) still carries javax-era annotation
    // references; springdoc reflects over them, so the legacy annotation API has to be resolvable.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    runtimeOnly 'javax.xml.bind:jaxb-api:2.3.1'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:7.4'

    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

/// A stable, product-named jar: end users type this path, Docker copies it by name, and jpackage
/// embeds it — none of which should change when the version does.
def serverJarName = 'blipradius-server.jar'

bootJar {
    archiveFileName = serverJarName
}

def flutterWebDir = file("${projectDir}/../dashboard/build/web")

processResources {
    if (flutterWebDir.exists()) {
        from(flutterWebDir) { into 'static' }
    }
}

/// Packaging a build with no UI produces a server that 404s on `/` — the worst possible thing to hand
/// an end user, and previously it happened silently. Anything meant for distribution checks first.
def requireUiBundle = {
    if (!file("${flutterWebDir}/index.html").exists()) {
        throw new GradleException("No Flutter web bundle at ${flutterWebDir}.\n"
                + "Distribution builds must ship the UI. Run:  cd dashboard && flutter build web --release")
    }
    // Also catch the stale case: the bundle exists now, but bootJar was built before it did.
    def packaged = layout.buildDirectory.file('resources/main/static/index.html').get().asFile
    if (!packaged.exists()) {
        throw new GradleException("The UI was not packaged into the jar (${packaged} missing).\n"
                + "Build the web bundle first, then rebuild:  ./gradlew :server:bootJar --rerun-tasks")
    }
}

/// One definition of how the shipped UI is built. `--no-web-resources-cdn` is the load-bearing flag:
/// without it the app fetches CanvasKit from gstatic at runtime and shows a blank page on an
/// air-gapped network. Everything that distributes the app goes through this task.
tasks.register('buildUi', Exec) {
    group = 'distribution'
    description = 'Build the Flutter web bundle with no CDN dependency.'
    workingDir file("${projectDir}/../dashboard")
    def isWin = System.getProperty('os.name').toLowerCase().contains('win')
    def flutter = isWin ? ['cmd', '/c', 'flutter'] : ['flutter']
    commandLine flutter + ['build', 'web', '--release',
                           '--web-renderer', 'canvaskit', '--no-web-resources-cdn']
}

tasks.register('desktopStage', Copy) {
    dependsOn 'bootJar'
    // Copy does not prune, so a jar left by an earlier build (a rename, a version bump) would be
    // packaged into the app image alongside the real one.
    doFirst {
        requireUiBundle()
        delete layout.buildDirectory.dir('desktop-stage')
    }
    from(layout.buildDirectory.file("libs/${serverJarName}"))
    into layout.buildDirectory.dir('desktop-stage')
}

def jpackageExe = {
    def isWin = System.getProperty('os.name').toLowerCase().contains('win')
    return "${System.getProperty('java.home')}/bin/jpackage" + (isWin ? '.exe' : '')
}

def jpackageCommon = { java.util.List extra ->
    def stage = layout.buildDirectory.dir('desktop-stage').get().asFile
    // The executable, Start-menu entry and installer all take this name — it is the most user-facing
    // string in the build, so it is the product name, not the internal `apiguard` identifier.
    def cmd = [jpackageExe(),
               '--name', 'BlipRadius',
               '--app-version', "${version}".replaceAll('[^0-9.]', '') ?: '1.0.0',
               '--input', stage.absolutePath,
               '--main-jar', serverJarName,
               '--java-options', '-Dspring.profiles.active=desktop',
               '--vendor', 'BlipRadius']
    cmd.addAll(extra)
    return cmd
}

tasks.register('desktopApp', Exec) {
    group = 'distribution'
    description = 'Build a portable single-folder desktop app (BlipRadius.exe) via jpackage.'
    dependsOn 'desktopStage'
    def dest = layout.buildDirectory.dir('desktop').get().asFile
    doFirst { delete dest }
    commandLine jpackageCommon(['--type', 'app-image', '--dest', dest.absolutePath])
}

tasks.register('desktopInstaller', Exec) {
    group = 'distribution'
    description = 'Build a native installer (.msi/.dmg/.deb) via jpackage. Windows needs WiX Toolset.'
    dependsOn 'desktopStage'
    def dest = layout.buildDirectory.dir('desktop-installer').get().asFile
    doFirst { delete dest; dest.mkdirs() }
    commandLine jpackageCommon(['--dest', dest.absolutePath])
}
